server {
    listen 8000;
    server_name localhost;

    root /app/static;
    index index.html;

    # Serve React Frontend
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Serve Generated Diagrams explicitly
    # Serve Generated Diagrams explicitly
    location /diagrams/ {
        # Standard Docker Path (Mounted volume or copied files)
        root /app/static;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # Proxy API requests to backend agent (running on 8081)
    location /invocations {
        proxy_pass http://127.0.0.1:8081/invocations;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # Increase timeouts to support long-running agent tasks (3500s)
        proxy_read_timeout 3500;
        proxy_connect_timeout 3500;
        proxy_send_timeout 3500;
    }
    
    # Also forward any other potential agent routes if needed
    location /ping {
        proxy_pass http://127.0.0.1:8081/ping;
    }
}
